spring.application.name=Docdrift

# Server Config
server.port=8080

# PostgreSQL Database Config
# Credentials come from environment variables - never commit real values here
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/docdrift}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Config
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# The schema is managed by Flyway migrations in src/main/resources/db/migration;
# Hibernate only checks that the entities match it
spring.jpa.hibernate.ddl-auto=validate
# Set JPA_SHOW_SQL=true locally to log every SQL statement
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# Flyway: databases created by older versions (without a migration history) are adopted automatically;
# baseline version 0 means every migration still runs, and each one is safe on an existing schema
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# GitHub API Settings
github.api.url=https://api.github.com
github.api.token=${GITHUB_PAT:}

# Gemini API Settings
gemini.api.url=https://generativelanguage.googleapis.com/v1beta
gemini.model=${GEMINI_MODEL:gemini-flash-latest}
gemini.api.key=${GEMINI_API_KEY:}

# Dashboard / API Access
# Key the dashboard must send in the X-API-Key header; requests are rejected while unset
docdrift.api.key=${DOCDRIFT_API_KEY:}
# Comma-separated list of origins allowed to call the API from a browser
docdrift.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# GitHub Webhook Secret (must match the secret configured on the GitHub webhook)
github.webhook.secret=${GITHUB_WEBHOOK_SECRET:}


# Drift Analysis Limits
# Diffs are cleaned (lockfiles, generated files and binaries removed) and capped before going to the LLM
docdrift.analysis.max-diff-chars=60000
docdrift.analysis.max-file-diff-chars=15000
# Documentation files fetched per scan, and how many of the relevant ones are sent to the LLM
docdrift.analysis.max-doc-candidates=25
docdrift.analysis.max-docs=8
docdrift.analysis.max-doc-chars=100000
# Parallel LLM calls per scan (lower this if you hit Gemini rate limits)
docdrift.analysis.llm-concurrency=2
# First wait before retrying a GitHub/Gemini call that failed with 429, 5xx or a network error
docdrift.http.retry-backoff=2s

# LLM Provider
# Which AI analyses the drift: "gemini" or "claude". The fallback is tried when the primary fails ("none" to disable).
docdrift.llm.provider=${LLM_PROVIDER:gemini}
docdrift.llm.fallback=${LLM_FALLBACK:none}

# Claude (Anthropic) Settings
anthropic.api.key=${ANTHROPIC_API_KEY:}
anthropic.model=${CLAUDE_MODEL:claude-opus-5-5}
# Thinking effort: low, medium, high, xhigh or max (higher is more thorough and costs more)
anthropic.effort=${CLAUDE_EFFORT:medium}

# Dashboard address, linked from pull request comments, commit statuses and alerts (optional)
docdrift.dashboard-url=${DASHBOARD_URL:}

# Alerts
# Email alerts need a mail server: set SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME and SPRING_MAIL_PASSWORD
docdrift.alerts.email-from=${ALERT_EMAIL_FROM:docdrift@localhost}
