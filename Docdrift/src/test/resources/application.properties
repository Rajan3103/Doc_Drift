# Test configuration: in-memory H2 so tests run without PostgreSQL or real API keys
spring.datasource.url=jdbc:h2:mem:docdrift;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop

github.api.url=http://localhost:0
github.api.token=test-token
gemini.api.url=http://localhost:0
gemini.model=test-model
gemini.api.key=test-gemini-key

docdrift.api.key=test-api-key
docdrift.cors.allowed-origins=http://localhost:5173
github.webhook.secret=test-webhook-secret
