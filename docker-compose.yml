# Runs the whole app locally: PostgreSQL, the Spring Boot backend and the dashboard.
#   1. cp .env.example .env   and fill in the values
#   2. docker compose up --build
#   3. open http://localhost:5173 and enter DOCDRIFT_API_KEY when asked
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: docdrift
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d docdrift"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./Docdrift
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/docdrift
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      GITHUB_PAT: ${GITHUB_PAT:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-latest}
      DOCDRIFT_API_KEY: ${DOCDRIFT_API_KEY:?Set DOCDRIFT_API_KEY in .env}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:?Set GITHUB_WEBHOOK_SECRET in .env}
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8080/api
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  db-data:
